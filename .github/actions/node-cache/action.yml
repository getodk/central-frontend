name: Node cache
description: Save or restore the cache of installed npm packages
inputs:
  mode:
    description: either 'save' or 'restore'
    required: true

runs:
  using: 'composite'
  steps:
  - name: 'Validate inputs'
    shell: sh
    env:
      MODE: ${{ inputs.mode }}
    run: |
      if [ "$MODE" != 'save' ] && [ "$MODE" != 'restore' ]; then
        echo "mode must be 'save' or 'restore', got '$MODE'" >&2
        exit 1
      fi

  # Resolves the Node version (from the volta pin in package.json) used in the install cache key
  - uses: actions/setup-node@v6
    id: setup-node
    with:
      node-version-file: package.json

  # Computing the key in one place keeps the save and restore steps below in sync
  - id: keys
    shell: sh
    env:
      INSTALL_KEY: install-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json', '.npmrc') }}
    run: |
      echo "install=$INSTALL_KEY" >> "$GITHUB_OUTPUT"

  - if: ${{ inputs.mode == 'save' }}
    uses: 'actions/cache/save@v6'
    with:
      path: |
        node_modules
        apps/*/node_modules
        packages/*/node_modules
      key: ${{ steps.keys.outputs.install }}

  - if: ${{ inputs.mode == 'restore' }}
    uses: 'actions/cache/restore@v6'
    with:
      path: |
        node_modules
        apps/*/node_modules
        packages/*/node_modules
      key: ${{ steps.keys.outputs.install }}
      fail-on-cache-miss: true
