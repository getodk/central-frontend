name: Relegate Azure mirrors
description: Relegate azure Ubuntu repo mirrors, as they can be fatally slow

runs:
  using: 'composite'
  steps:
  - shell: sh
    run: cat /etc/apt/apt-mirrors.txt
  - name: relegate azure ubuntu mirrors
    shell: sh
    run: |
      sudo sed \
           -i \
           -e       '/archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:2/priority:1/' \
           -e '/azure.archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:0/priority:2/' \
           -e      '/security.ubuntu.com\/ubuntu\/\tpriority/ s/priority:3/priority:3/' \
           /etc/apt/apt-mirrors.txt
  - shell: sh
    run: cat /etc/apt/apt-mirrors.txt
