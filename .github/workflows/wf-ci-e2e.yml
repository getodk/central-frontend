name: Web Forms E2E Tests

on:
  workflow_call:

jobs:
  web-forms-e2e-build:
    name: 'Build for e2e'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    container:
      # The image version must match the @playwright/test version in the root package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001

    steps:
      - uses: 'actions/checkout@v6'

      - uses: 'actions/setup-node@v6'
        with:
          node-version-file: package.json
          cache: 'npm'

      - run: 'npm ci --no-audit'

      # Builds only what the e2e tests need.
      - run: 'npx turbo run build --filter=@getodk/web-forms'

      - uses: ./.github/actions/node-cache
        with:
          mode: save

  web-forms-e2e-functional:
    name: 'Functional e2e'
    needs: web-forms-e2e-build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 4
    container:
      # The image version must match the @playwright/test version in the root package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: 'actions/checkout@v6'

      - uses: ./.github/actions/node-cache
        with:
          mode: restore

      - name: 'Run functional e2e tests'
        run: 'npm run test:e2e:functional:${{ matrix.browser }} -w=packages/web-forms'

      - name: 'Upload Playwright results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-functional-${{ matrix.browser }}
          path: packages/web-forms/test-results
          retention-days: 10
          if-no-files-found: ignore

  web-forms-e2e-visual:
    name: 'Visual e2e'
    needs: web-forms-e2e-build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 6
    container:
      # The image version must match the @playwright/test version in the root package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: 'actions/checkout@v6'

      - uses: ./.github/actions/node-cache
        with:
          mode: restore

      # xvfb-run is used for visual tests to compare snapshots more accurately.
      - name: 'Run visual e2e tests'
        run: 'xvfb-run --auto-servernum npm run test:e2e:visual:${{ matrix.browser }} -w=packages/web-forms'

      - name: 'Upload Playwright results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-visual-${{ matrix.browser }}
          path: packages/web-forms/test-results
          retention-days: 10
          if-no-files-found: ignore
