# Runs the Web Forms functional and visual tests in the Playwright image.
# Use it through the `test:e2e:*` npm scripts, which set the required variables.
name: web-forms-test-runner
services:
  e2e:
    build:
      context: ../../..
      dockerfile: packages/web-forms/e2e/Dockerfile
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?run through the test:e2e:* npm scripts}
        HOST_UID: ${HOST_UID:?run through the test:e2e:* npm scripts}
        HOST_GID: ${HOST_GID:?run through the test:e2e:* npm scripts}

    platform: linux/amd64
    init: true
    ipc: host
    environment:
      PLAYWRIGHT_HTML_OPEN: never
    volumes:
      - .:/work/packages/web-forms/e2e
      - ../test-results:/work/packages/web-forms/test-results
      - ../playwright-report:/work/packages/web-forms/playwright-report
